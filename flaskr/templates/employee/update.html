{% extends 'base.html' %}

{% block header %}
  <h1>{% block title %}Edit Employee{% endblock %}</h1>
{% endblock %}

{% block content %}

<div class="auth-box">

  <!-- UPDATE FORM -->
  <form method="post" class="auth-form">

    <div class="form-group">
      <label for="employee_id">Employee ID</label>
      <input
        name="employee_id"
        id="employee_id"
        value="{{ request.form.get('employee_id', emp.employee_id) }}"
        required
      >
    </div>

    <div class="form-group">
      <label for="last_name">Last Name</label>
      <input
        name="last_name"
        id="last_name"
        value="{{ request.form.get('last_name', emp.last_name) }}"
        required
      >
    </div>

    <div class="form-group">
      <label for="first_name">First Name</label>
      <input
        name="first_name"
        id="first_name"
        value="{{ request.form.get('first_name', emp.first_name) }}"
        required
      >
    </div>

    <div class="form-group">
      <label for="middle_name">Middle Name</label>
      <input
        name="middle_name"
        id="middle_name"
        value="{{ request.form.get('middle_name', emp.middle_name or '') }}"
      >
    </div>

    <button type="submit" class="btn primary full">
      Save Changes
    </button>

  </form>

  <!-- DELETE SECTION -->
  <form
    action="{{ url_for('employee.delete_employee', id=emp.id) }}"
    method="post"
    class="delete-box"
  >
    <button
      type="submit"
      class="btn danger full"
      onclick="return confirm('Are you sure you want to delete this employee?');"
    >
      Delete Employee
    </button>
  </form>
