{% extends 'base.html' %}

{% block header %}
  <h1>{% block title %}New Employee{% endblock %}</h1>
{% endblock %}

{% block content %}

<div class="auth-box">

  <form method="post" class="auth-form">

    <div class="form-group">
      <label for="employee_id">Employee ID</label>
      <input
        name="employee_id"
        id="employee_id"
        value="{{ request.form.get('employee_id', '') }}"
        required
      >
    </div>

    <div class="form-group">
      <label for="last_name">Last Name</label>
      <input
        name="last_name"
        id="last_name"
        value="{{ request.form.get('last_name', '') }}"
        required
      >
    </div>

    <div class="form-group">
      <label for="first_name">First Name</label>
      <input
        name="first_name"
        id="first_name"
        value="{{ request.form.get('first_name', '') }}"
        required
      >
    </div>

    <div class="form-group">
      <label for="middle_name">Middle Name</label>
      <input
        name="middle_name"
        id="middle_name"
        value="{{ request.form.get('middle_name', '') }}"
      >
    </div>

    <button type="submit" class="btn primary full">
      Save Employee
    </button>

  </form>

</div>

{% endblock %}
