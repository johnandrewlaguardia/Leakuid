{% extends 'base.html' %}

{% block header %}
  <h1>{% block title %}Edit Post{% endblock %}</h1>
{% endblock %}

{% block content %}

<div class="auth-box">

  <!-- UPDATE FORM -->
  <form method="post" class="auth-form">

    <div class="form-group">
      <label for="title">Title</label>
      <input
        name="title"
        id="title"
        value="{{ request.form.get('title', post['title']) }}"
        required
      >
    </div>

    <div class="form-group">
      <label for="body">Body</label>
      <textarea name="body" id="body" rows="7">
{{ request.form.get('body', post['body']) }}
      </textarea>
    </div>

    <button type="submit" class="btn primary full">
      Save Changes
    </button>

  </form>

  <!-- DELETE SECTION -->
  <form
    action="{{ url_for('blog.delete', id=post['id']) }}"
    method="post"
    class="delete-box"
  >
    <button
      type="submit"
      class="btn danger full"
      onclick="return confirm('Are you sure you want to delete this post?');"
    >
      Delete Post
    </button>
  </form>

</div>

{% endblock %}
